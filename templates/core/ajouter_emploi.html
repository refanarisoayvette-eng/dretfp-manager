{% extends 'base.html' %}

{% block title %}Ajouter un créneau{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Nouveau créneau d'emploi du temps</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Filière *</label>
                        <select name="filiere" class="form-select" required>
                            <option value="">-- Choisir --</option>
                            {% for f in filieres %}
                            <option value="{{ f.id }}">{{ f.etablissement.nom }} - {{ f.code }} - {{ f.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Jour *</label>
                            <select name="jour" class="form-select" required>
                                {% for j in jours %}<option value="{{ j }}">{{ j }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Créneau horaire *</label>
                            <select name="creneau" class="form-select" required>
                                {% for c in creneaux %}<option value="{{ c.id }}">{{ c.nom }} ({{ c.heure_debut|time:"H:i" }}-{{ c.heure_fin|time:"H:i" }})</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Matière / Module *</label>
                        <input type="text" name="matiere" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salle</label>
                            <select name="salle" class="form-select">
                                <option value="">-- Aucune --</option>
                                {% for s in salles %}<option value="{{ s.id }}">{{ s.nom }} ({{ s.etablissement.nom }})</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Formateur</label>
                            <select name="formateur" class="form-select">
                                <option value="">-- Aucun --</option>
                                {% for f in formateurs %}<option value="{{ f.id }}">{{ f.get_full_name|default:f.username }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Année scolaire</label>
                        <input type="text" name="annee_scolaire" class="form-control" value="2026-2027">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Remarque</label>
                        <textarea name="remarque" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Enregistrer</button>
                        <a href="{% url 'liste_emplois' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

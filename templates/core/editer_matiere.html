{% extends 'base.html' %}

{% block title %}Modifier la matière{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Modifier la matière</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Filière *</label>
                        <select name="filiere" class="form-select" required>
                            {% for f in filieres %}
                            <option value="{{ f.id }}" {% if matiere.filiere.id == f.id %}selected{% endif %}>{{ f.code }} - {{ f.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Code *</label>
                            <input type="text" name="code" class="form-control" value="{{ matiere.code }}" required>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Nom *</label>
                            <input type="text" name="nom" class="form-control" value="{{ matiere.nom }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select name="type_matiere" class="form-select">
                            <option value="Theorique" {% if matiere.type_matiere == 'Theorique' %}selected{% endif %}>Théorique</option>
                            <option value="Pratique" {% if matiere.type_matiere == 'Pratique' %}selected{% endif %}>Pratique</option>
                            <option value="Theorique et Pratique" {% if matiere.type_matiere == 'Theorique et Pratique' %}selected{% endif %}>Théorique et Pratique</option>
                            <option value="Sport" {% if matiere.type_matiere == 'Sport' %}selected{% endif %}>Sport</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Heures Théorie</label>
                            <input type="number" name="heures_theorie" class="form-control" value="{{ matiere.heures_theorie }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Heures Pratique</label>
                            <input type="number" name="heures_pratique" class="form-control" value="{{ matiere.heures_pratique }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Coefficient</label>
                            <input type="number" name="coefficient" class="form-control" value="{{ matiere.coefficient }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ matiere.description }}</textarea>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="actif" class="form-check-input" id="actif" {% if matiere.actif %}checked{% endif %}>
                        <label class="form-check-label" for="actif">Matière active</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Enregistrer</button>
                        <a href="{% url 'liste_matieres' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

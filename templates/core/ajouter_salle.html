{% extends 'base.html' %}

{% block title %}Ajouter une salle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Nouvelle salle</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Établissement *</label>
                        <select name="etablissement" class="form-select" required>
                            <option value="">-- Choisir --</option>
                            {% for e in etablissements %}
                            <option value="{{ e.id }}">{{ e.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nom *</label>
                        <input type="text" name="nom" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Capacité</label>
                            <input type="number" name="capacite" class="form-control" value="30">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Type</label>
                            <input type="text" name="type_salle" class="form-control" placeholder="Ex: Atelier, Salle de cours">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bâtiment</label>
                        <input type="text" name="batiment" class="form-control">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Enregistrer</button>
                        <a href="{% url 'liste_salles' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

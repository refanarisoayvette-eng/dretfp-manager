{% extends 'base.html' %}

{% block title %}Ajouter ligne budgétaire{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Nouvelle ligne budgétaire</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Établissement *</label>
                        <select name="etablissement" class="form-select" required>
                            <option value="">-- Choisir --</option>
                            {% for e in etablissements %}
                            <option value="{{ e.id }}">{{ e.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Produit *</label>
                        <select name="produit" class="form-select" required>
                            <option value="">-- Choisir --</option>
                            {% for p in produits %}
                            <option value="{{ p.id }}">{{ p.libelle }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Source *</label>
                            <select name="source_financement" class="form-select" required>
                                <option value="RPI">RPI</option>
                                <option value="FCE">FCE</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Code PCOP</label>
                            <select name="pcop" class="form-select">
                                <option value="">-- Aucun --</option>
                                {% for pc in pcops %}
                                <option value="{{ pc.id }}">{{ pc.code }} - {{ pc.libelle|truncatechars:30 }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Montant prévu (Ar)</label>
                            <input type="number" name="montant_prevu" class="form-control" value="0" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Montant réalisé (Ar)</label>
                            <input type="number" name="montant_realise" class="form-control" value="0" step="0.01">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Statut</label>
                        <select name="statut" class="form-select">
                            <option value="Planifie">Planifié</option>
                            <option value="Engage">Engagé</option>
                            <option value="Liquide">Liquidé</option>
                            <option value="Paye">Payé</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Remarque</label>
                        <textarea name="remarque" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Enregistrer
                        </button>
                        <a href="{% url 'liste_budgets' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Retour
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

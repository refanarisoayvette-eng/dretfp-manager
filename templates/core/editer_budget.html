{% extends 'base.html' %}

{% block title %}Modifier ligne budgétaire{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Modifier la ligne budgétaire</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Établissement</label>
                        <input type="text" class="form-control" value="{{ ligne.etablissement.nom }}" disabled>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Produit</label>
                        <input type="text" class="form-control" value="{{ ligne.produit.libelle }}" disabled>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Source de financement</label>
                            <input type="text" class="form-control" value="{{ ligne.source_financement }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Code PCOP</label>
                            <input type="text" class="form-control" value="{{ ligne.pcop.code|default:'-' }}" disabled>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Montant prévu (Ar)</label>
                            <input type="number" name="montant_prevu" class="form-control" 
                                   value="{{ ligne.montant_prevu|floatformat:0 }}" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Montant réalisé (Ar)</label>
                            <input type="number" name="montant_realise" class="form-control" 
                                   value="{{ ligne.montant_realise|floatformat:0 }}" step="0.01">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Statut</label>
                        <select name="statut" class="form-select">
                            <option value="Planifie" {% if ligne.statut == 'Planifie' %}selected{% endif %}>Planifié</option>
                            <option value="Engage" {% if ligne.statut == 'Engage' %}selected{% endif %}>Engagé</option>
                            <option value="Liquide" {% if ligne.statut == 'Liquide' %}selected{% endif %}>Liquidé</option>
                            <option value="Paye" {% if ligne.statut == 'Paye' %}selected{% endif %}>Payé</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Remarque</label>
                        <textarea name="remarque" class="form-control" rows="3">{{ ligne.remarque }}</textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Enregistrer
                        </button>
                        <a href="{% url 'liste_budgets' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Retour
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

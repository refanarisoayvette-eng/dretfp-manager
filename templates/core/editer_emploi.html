{% extends 'base.html' %}

{% block title %}Modifier le créneau{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Modifier le créneau</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Filière *</label>
                        <select name="filiere" class="form-select" required>
                            {% for f in filieres %}
                            <option value="{{ f.id }}" {% if emploi.filiere.id == f.id %}selected{% endif %}>{{ f.etablissement.nom }} - {{ f.code }} - {{ f.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Jour *</label>
                            <select name="jour" class="form-select" required>
                                {% for j in jours %}<option value="{{ j }}" {% if emploi.jour == j %}selected{% endif %}>{{ j }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Créneau horaire *</label>
                            <select name="creneau" class="form-select" required>
                                {% for c in creneaux %}<option value="{{ c.id }}" {% if emploi.creneau.id == c.id %}selected{% endif %}>{{ c.nom }} ({{ c.heure_debut|time:"H:i" }}-{{ c.heure_fin|time:"H:i" }})</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Matière *</label>
                        <input type="text" name="matiere" class="form-control" value="{{ emploi.matiere }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salle</label>
                            <select name="salle" class="form-select">
                                <option value="">-- Aucune --</option>
                                {% for s in salles %}<option value="{{ s.id }}" {% if emploi.salle.id == s.id %}selected{% endif %}>{{ s.nom }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Formateur</label>
                            <select name="formateur" class="form-select">
                                <option value="">-- Aucun --</option>
                                {% for f in formateurs %}<option value="{{ f.id }}" {% if emploi.formateur.id == f.id %}selected{% endif %}>{{ f.get_full_name|default:f.username }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Année scolaire</label>
                        <input type="text" name="annee_scolaire" class="form-control" value="{{ emploi.annee_scolaire }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Remarque</label>
                        <textarea name="remarque" class="form-control" rows="2">{{ emploi.remarque }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Enregistrer</button>
                        <a href="{% url 'liste_emplois' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Ajouter une matière{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Nouvelle matière</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Filière *</label>
                        <select name="filiere" class="form-select" required>
                            <option value="">-- Choisir --</option>
                            {% for f in filieres %}
                            <option value="{{ f.id }}" {% if filiere_selectionnee == f.id|stringformat:"s" %}selected{% endif %}>{{ f.etablissement.nom }} - {{ f.code }} - {{ f.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Code *</label>
                            <input type="text" name="code" class="form-control" placeholder="Ex: MATH" required>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Nom *</label>
                            <input type="text" name="nom" class="form-control" placeholder="Ex: Mathématiques" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select name="type_matiere" class="form-select">
                            <option value="Theorique">Théorique</option>
                            <option value="Pratique">Pratique</option>
                            <option value="Theorique et Pratique">Théorique et Pratique</option>
                            <option value="Sport">Éducation Physique et Sportive</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Heures Théorie</label>
                            <input type="number" name="heures_theorie" class="form-control" value="0">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Heures Pratique</label>
                            <input type="number" name="heures_pratique" class="form-control" value="0">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Coefficient</label>
                            <input type="number" name="coefficient" class="form-control" value="1">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Enregistrer</button>
                        <a href="{% url 'liste_matieres' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Ajouter une filière{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Nouvelle filière</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Établissement *</label>
                        <select name="etablissement" class="form-select" required>
                            <option value="">-- Choisir --</option>
                            {% for e in etablissements %}
                            <option value="{{ e.id }}">{{ e.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Code *</label>
                            <input type="text" name="code" class="form-control" placeholder="Ex: BTP" required>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Nom *</label>
                            <input type="text" name="nom" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Niveau</label>
                            <select name="niveau" class="form-select">
                                <option value="CAP">CAP</option>
                                <option value="BEP">BEP</option>
                                <option value="BAC">Baccalauréat</option>
                                <option value="AMB">AMB</option>
                                <option value="FPQ">FPQ</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nb apprenants</label>
                            <input type="number" name="nb_apprenants" class="form-control" value="0">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Durée (années)</label>
                            <input type="number" name="duree_annees" class="form-control" value="2">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Enregistrer</button>
                        <a href="{% url 'liste_filieres' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

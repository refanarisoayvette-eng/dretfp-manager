{% extends 'base.html' %}

{% block title %}Modifier le PTA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Modifier le PTA</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="alert alert-info">
                        <strong>Établissement :</strong> {{ pta.etablissement.nom }}<br>
                        <strong>Année :</strong> {{ pta.annee }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Titre *</label>
                        <input type="text" name="titre" class="form-control" 
                               value="{{ pta.titre }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Statut</label>
                        <select name="statut" class="form-select">
                            <option value="Brouillon" {% if pta.statut == 'Brouillon' %}selected{% endif %}>Brouillon</option>
                            <option value="Valide" {% if pta.statut == 'Valide' %}selected{% endif %}>Validé</option>
                            <option value="En cours" {% if pta.statut == 'En cours' %}selected{% endif %}>En cours</option>
                            <option value="Termine" {% if pta.statut == 'Termine' %}selected{% endif %}>Terminé</option>
                            <option value="Archive" {% if pta.statut == 'Archive' %}selected{% endif %}>Archivé</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Responsable</label>
                        <input type="text" name="responsable" class="form-control" value="{{ pta.responsable }}">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date début</label>
                            <input type="date" name="date_debut" class="form-control" 
                                   value="{{ pta.date_debut|date:'Y-m-d' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date fin</label>
                            <input type="date" name="date_fin" class="form-control" 
                                   value="{{ pta.date_fin|date:'Y-m-d' }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Remarque</label>
                        <textarea name="remarque" class="form-control" rows="3">{{ pta.remarque }}</textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Enregistrer
                        </button>
                        <a href="{% url 'detail_pta' pta.id %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Créer un PTA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-calendar-plus"></i> Créer un Plan de Travail Annuel</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Établissement *</label>
                            <select name="etablissement" class="form-select" required>
                                <option value="">-- Choisir --</option>
                                {% for e in etablissements %}
                                <option value="{{ e.id }}">{{ e.nom }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Année *</label>
                            <select name="annee" class="form-select" required>
                                {% for a in annees %}
                                <option value="{{ a }}" {% if a == 2027 %}selected{% endif %}>{{ a }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Titre *</label>
                        <input type="text" name="titre" class="form-control" 
                               placeholder="Ex: Plan de Travail Annuel 2027" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Responsable</label>
                        <input type="text" name="responsable" class="form-control" 
                               placeholder="Nom du responsable">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date début</label>
                            <input type="date" name="date_debut" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date fin</label>
                            <input type="date" name="date_fin" class="form-control">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Remarque</label>
                        <textarea name="remarque" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Créer le PTA
                        </button>
                        <a href="{% url 'liste_pta' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Modifier l'activité PTA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Modifier l'activité</h4>
                <small>{{ activite.PTA.titre }}</small>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Titre *</label>
                        <input type="text" name="titre" class="form-control" 
                               value="{{ activite.titre }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ activite.description }}</textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Responsable</label>
                            <input type="text" name="responsable" class="form-control" 
                                   value="{{ activite.responsable }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ordre</label>
                            <input type="number" name="ordre" class="form-control" value="{{ activite.ordre }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Statut</label>
                            <select name="statut" class="form-select">
                                <option value="Non commence" {% if activite.statut == 'Non commence' %}selected{% endif %}>Non commencé</option>
                                <option value="En cours" {% if activite.statut == 'En cours' %}selected{% endif %}>En cours</option>
                                <option value="Termine" {% if activite.statut == 'Termine' %}selected{% endif %}>Terminé</option>
                                <option value="Annule" {% if activite.statut == 'Annule' %}selected{% endif %}>Annulé</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Avancement (%)</label>
                            <input type="number" name="taux_avancement" class="form-control" 
                                   min="0" max="100" value="{{ activite.taux_avancement }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Budget prévu (Ar)</label>
                            <input type="number" name="budget_prevu" class="form-control" 
                                   value="{{ activite.budget_prevu }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Date début</label>
                            <input type="date" name="date_debut" class="form-control" 
                                   value="{{ activite.date_debut|date:'Y-m-d' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Date fin</label>
                            <input type="date" name="date_fin" class="form-control" 
                                   value="{{ activite.date_fin|date:'Y-m-d' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Budget réalisé (Ar)</label>
                            <input type="number" name="budget_realise" class="form-control" 
                                   value="{{ activite.budget_realise }}">
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Enregistrer
                        </button>
                        <a href="{% url 'detail_pta' activite.PTA.id %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Ajouter une activité{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Nouvelle activité</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Programme *</label>
                        <select name="programme" class="form-select" required>
                            <option value="">-- Choisir --</option>
                            {% for p in programmes %}
                            <option value="{{ p.id }}">{{ p.code }} - {{ p.libelle }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Libellé *</label>
                        <input type="text" name="libelle" class="form-control" 
                               placeholder="Ex: Assurer la formation des apprenants" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Objectif</label>
                        <textarea name="objectif" class="form-control" rows="3"
                                  placeholder="Objectif de l'activité..."></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Enregistrer
                        </button>
                        <a href="{% url 'liste_activites' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

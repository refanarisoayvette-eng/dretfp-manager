{% extends 'base.html' %}

{% block title %}Déconnexion - DRETFP Manager{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow text-center">
            <div class="card-body">
                <i class="bi bi-check-circle text-success" style="font-size: 4rem;"></i>
                <h3 class="mt-3">Vous êtes déconnecté</h3>
                <p class="text-muted">Merci d'avoir utilisé DRETFP Manager</p>
                <a href="{% url 'login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Se reconnecter
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
